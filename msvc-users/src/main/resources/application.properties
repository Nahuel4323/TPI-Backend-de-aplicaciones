# Cargar el .env de la carpeta desde la que se ejecuta el servicio.
spring.config.import=optional:file:./.env[.properties]

spring.application.name=users

server.port=${SERVER_PORT:8081}
server.address=127.0.0.1

# Rechazar campos como rol o keycloakId enviados fuera del contrato.
spring.jackson.deserialization.fail-on-unknown-properties=true

# Docker Compose crea la base; las credenciales se cargan desde el .env local.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/users_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Desarrollo local: crear y actualizar tablas a partir de las entidades al iniciar.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

springdoc.paths-to-match=/api/users/**

# Cuenta de servicio para crear clientes; nunca usar el administrador master en la aplicación.
app.keycloak.base-url=${KEYCLOAK_BASE_URL:http://localhost:8180}
app.keycloak.realm=${KEYCLOAK_REALM:complejos-deportivos}
app.keycloak.registration-client-id=${KEYCLOAK_REGISTRATION_CLIENT_ID:users-registration}
app.keycloak.registration-client-secret=${KEYCLOAK_REGISTRATION_CLIENT_SECRET:}
app.keycloak.timeout-seconds=${KEYCLOAK_TIMEOUT_SECONDS:10}

# Activación explícita y temporal para inicializar el primer administrador.
app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
