$kind: http-request
url: "{{users_url}}/api/users/clientes"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Ana",
      "apellido": "Perez",
      "telefono": "3511234567",
      "preferenciaContacto": "TELEFONO"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('HTTP 403',()=>pm.response.to.have.status(403));
    language: text/javascript
order: 3000
