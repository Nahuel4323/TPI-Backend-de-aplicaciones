$kind: http-request
url: "{{gateway_url}}/api/users/administradores"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: "{\r

    \  \"email\": \"{{admin_registration_email}}\",\r

    \  \"password\": \"{{admin_registration_password}}\",\r

    \  \"nombre\": \"Ana\",\r

    \  \"apellido\": \"Perez\",\r

    \  \"telefono\": \"3511234567\",\r

    \  \"telefonoLaboral\": \"3517654321\"\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{admin_access_token}}"
scripts:
  - type: beforeRequest
    code: |-
      // Postman > Scripts > Pre-request. Authorization: Bearer {{admin_access_token}}.
      // Credenciales del administrador de negocio en el entorno local, nunca en este archivo.
      (function autenticarAdmin() {
          const baseUrl = String(pm.variables.get("keycloak_url") || "http://localhost:8180").replace(/\/$/, "");
          const realm = pm.variables.get("keycloak_realm") || "complejos-deportivos";
          const clientId = pm.variables.get("keycloak_auto_client_id") || "postman-auto";
          const username = pm.environment.get("admin_login_email");
          const password = pm.environment.get("admin_login_password");

          function detener(message) {
              // No reutilizar un token anterior si falla esta autenticación.
              pm.variables.set("admin_access_token", "");
              pm.execution.skipRequest();
              throw new Error(message);
          }

          pm.variables.set("admin_access_token", "");
          if (!username || !password) {
              detener("Seleccioná el entorno y completá admin_login_email y admin_login_password con valores locales.");
          }

          pm.sendRequest({
              url: `${baseUrl}/realms/${encodeURIComponent(realm)}/protocol/openid-connect/token`,
              method: "POST",
              header: { "Content-Type": "application/x-www-form-urlencoded" },
              body: {
                  mode: "urlencoded",
                  urlencoded: [
                      { key: "grant_type", value: "password" },
                      { key: "client_id", value: clientId },
                      { key: "username", value: username },
                      { key: "password", value: password },
                      { key: "scope", value: "openid profile email" }
                  ]
              }
          }, function (error, response) {
              if (error) detener("No se pudo conectar con Keycloak. Revisá keycloak_url y que esté iniciado.");
              if (response.code !== 200) {
                  detener(`Keycloak devolvió HTTP ${response.code}. Revisá las credenciales, el estado de la cuenta y el cliente postman-auto.`);
              }
              let data;
              try { data = response.json(); }
              catch (_) { detener("Keycloak no devolvió una respuesta JSON válida."); }
              if (!data || typeof data.access_token !== "string" || !data.access_token.trim()) {
                  detener("Keycloak no devolvió un access token válido.");
              }
              // Valor temporal: se utiliza en esta petición, sin guardar tokens en el entorno exportable.
              pm.variables.set("admin_access_token", data.access_token);
          });
      }());
    language: text/javascript
  - type: afterResponse
    code: pm.test('HTTP 201',()=>pm.response.to.have.status(201));
    language: text/javascript
order: 3000
