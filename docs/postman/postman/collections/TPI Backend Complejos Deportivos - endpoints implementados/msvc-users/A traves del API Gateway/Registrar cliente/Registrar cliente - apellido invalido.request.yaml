$kind: http-request
url: "{{gateway_url}}/api/users/clientes"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Ana",
      "apellido": " ",
      "telefono": "3511234567",
      "preferenciaContacto": "TELEFONO"
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 400',()=>pm.response.to.have.status(400));
    language: text/javascript
order: 5000
