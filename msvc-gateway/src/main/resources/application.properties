# Cargar el .env de la carpeta desde la que se ejecuta el servicio.
spring.config.import=optional:file:./.env[.properties]

spring.application.name=gateway

server.port=${SERVER_PORT:8080}
server.address=127.0.0.1
app.gateway.internal-token=${GATEWAY_INTERNAL_TOKEN}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/complejos-deportivos}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/complejos-deportivos/protocol/openid-connect/certs}
spring.security.oauth2.resourceserver.jwt.audiences=backend-api

# Las rutas conservan el prefijo /api al reenviar la solicitud.
spring.cloud.gateway.server.webflux.routes[0].id=users
spring.cloud.gateway.server.webflux.routes[0].uri=${USERS_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/users,/api/users/**

spring.cloud.gateway.server.webflux.routes[1].id=spaces
spring.cloud.gateway.server.webflux.routes[1].uri=${SPACES_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/spaces,/api/spaces/**

spring.cloud.gateway.server.webflux.routes[2].id=bookings
spring.cloud.gateway.server.webflux.routes[2].uri=${BOOKINGS_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/bookings,/api/bookings/**

# Registro de cliente protegido por JWT y rol CLIENTE; otras US denegadas hasta definir su politica.

# Documentacion centralizada
springdoc.api-docs.enabled=true
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.urls[0].name=Users
springdoc.swagger-ui.urls[0].url=/docs/users
springdoc.swagger-ui.persist-authorization=false
spring.cloud.gateway.server.webflux.routes[3].id=users-openapi
spring.cloud.gateway.server.webflux.routes[3].uri=${USERS_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/docs/users
spring.cloud.gateway.server.webflux.routes[3].predicates[1]=Method=GET
spring.cloud.gateway.server.webflux.routes[3].filters[0]=SetPath=/v3/api-docs
